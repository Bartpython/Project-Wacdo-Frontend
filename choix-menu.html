<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/choix-menu.css" />
    <title>Wacdo</title>
  </head>
  <body>
    <header>
      <div class="slider-bar">
        <button class="fleche-slider">
          <img
            id="fleche-left"
            src="asset/images/fleche-slider-left.png"
            alt="Flèche gauche"
          />
        </button>

        <div class="zone-contenu-scroll">
          <button class="elements-slider">
            <img src="asset/categories/menus.png" alt="menus" />
            <span class="text-elements-slider">Menus</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/burgers.png" alt="burgers" />
            <span class="text-elements-slider">Sandwichs</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/wraps.png" alt="wraps" />
            <span class="text-elements-slider">Wraps</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/frites.png" alt="frites" />
            <span class="text-elements-slider">Frites</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/boissons.png" alt="boissons" />
            <span class="text-elements-slider">Boissons</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/encas.png" alt="encas" />
            <span class="text-elements-slider">Encas</span>
          </button>
          <button class="elements-slider">
            <img src="asset/categories/desserts.png" alt="desserts" />
            <span class="text-elements-slider">Desserts</span>
          </button>
        </div>
        <button class="fleche-slider">
          <img
            id="fleche-right"
            src="asset/images/fleche-slider-right.png"
            alt="Flèche droite"
          />
        </button>
      </div>
    </header>
  </body>
</html>
