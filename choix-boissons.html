<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/choix-boissons.css" />
    <title>Wacdo</title>
  </head>
  <body>
    <header>
      <div class="slider-bar">
        <button class="fleche-slider-left">
          <img
            id="fleche-left"
            src="asset/images/fleche-slider-left.png"
            alt="Flèche gauche"
          />
        </button>

        <div class="zone-contenu-scroll">
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/menus.png"
              alt="menus"
            />
            <span class="text-elements-slider">Menus</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/burgers.png"
              alt="burgers"
            />
            <span class="text-elements-slider">Sandwichs</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/wraps.png"
              alt="wraps"
            />
            <span class="text-elements-slider">Wraps</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/frites.png"
              alt="frites"
            />
            <span class="text-elements-slider">Frites</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/boissons.png"
              alt="boissons"
            />
            <span class="text-elements-slider">Boissons</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/encas.png"
              alt="encas"
            />
            <span class="text-elements-slider">Encas</span>
          </button>
          <button class="elements-slider">
            <img
              class="img-elements-slider"
              src="asset/categories/desserts.png"
              alt="desserts"
            />
            <span class="text-elements-slider">Desserts</span>
          </button>
        </div>
        <button class="fleche-slider-right">
          <img
            id="fleche-right"
            src="asset/images/fleche-slider-right.png"
            alt="Flèche droite"
          />
        </button>
      </div>
    </header>
    <h1 id="page-title">Nos Boissons Fraîches</h1>
    <h2 id="page-subtitle">Une petite soif, sucrée, légère, rafraîchissante</h2>
    <div id="choose-water">
      <button class="card-products">
        <img id="img-water" src="asset/boissons/EAU.png" alt="eau" />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-coca-cola"
          src="asset/boissons/coca-cola.png"
          alt="Coca Cola"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-coca-zero"
          src="asset/boissons/coca-sans-sucres.png"
          alt="Coca Zero"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img id="img-fanta" src="asset/boissons/fanta.png" alt="Fanta" />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-orange-juice"
          src="asset/boissons/jus-orange.png"
          alt="Jus d'orange"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-mint-green"
          src="asset/boissons/the-vert-citron-sans-sucres.png"
          alt="Thé vert menthe"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-peach-iced-tea"
          src="asset/boissons/ice-tea-peche.png"
          alt="Thé glacé à la pêche"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
      <button class="card-products">
        <img
          id="img-apple-juice"
          src="asset/boissons/jus-pomme-bio.png"
          alt="Jus de pomme"
        />
        <span class="text-choose-water">Nom du produit</span><br />
        <span class="price-choose-water">7.50€</span>
      </button>
    </div>
    <div id="produit-card">
      <img id="logo-wacdo" src="asset/images/logo.png" alt="Logo Wacdo" />
      <h1>Commande numéro<br />Sur place :</h1>
      <div id="ligne1"></div>
      <div id="ligne2"></div>
      <div id="total">TOTAL<br />(ttc)</div>
      <div id="abandon-topay">
        <button id="abandon">Abandon</button>
        <button id="topay">Payer</button>
      </div>
    </div>
  </body>
</html>
