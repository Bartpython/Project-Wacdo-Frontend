<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Wacdo</title>
  </head>

  <body>
    <header>
      <section class="mc-landing-banner">
        <img
          class="mc-landing-banner-img"
          src="asset/images/mc_landing_banner.png"
          alt="Description de l'image"
        />
      </section>
    </header>

    <main>
      <section class="menu-box">
        <h1>Bonjour,</h1>
        <h2>
          Souhaitez-vous consommer votre menu sur place ou préférez-vous
          l'emporter ?
        </h2>
        <div class="menu-buttons">
          <button id="sur-place">
            <img id="illustration-sur-place" src="asset/images/illustration-sur-place.png" alt="Illustration sur place" />
          </button>
          <button id="a-emporter">
            <img id="illustration-a-emporter" src="asset/images/illustration-a-emporter.png" alt="Illustration à emporter" />
          </button>
        </div>
      </section>

      

      <aside></aside>
    </main>

    <footer></footer>
  </body>
</html>
